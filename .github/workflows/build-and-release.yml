name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run marker-file tests
        shell: powershell
        run: .\scripts\test.ps1

      - name: Build portable release
        shell: powershell
        run: |
          $version = if ('${{ github.ref_name }}' -match '^v(.+)$') { $Matches[1] } else { '1.0.0-dev' }
          .\scripts\build.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wades-MiB-Pinner
          path: |
            artifacts/Wades-MiB-Pinner-v*.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          gh release create '${{ github.ref_name }}' `
            "artifacts/Wades-MiB-Pinner-v$version.zip" `
            "artifacts/Wades-MiB-Pinner-v$version/Wades-MiB-Pinner.exe" `
            'artifacts/SHA256SUMS.txt' `
            --title "Wade's MiB Pinner $version" `
            --generate-notes
